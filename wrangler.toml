name = "fpanel-miniapp"
main = "worker/index.ts"
compatibility_date = "2026-10-12"

[observability]
enabled = true

[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/bot", "/hooks/*", "/setup/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "fpanel"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
OWNER_IDS = "7908843804"
DEV_FAKE_USER_ID = ""
